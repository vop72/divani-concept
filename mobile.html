<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Di'vani — мобильная версия</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a2724;--ink:#f5f3f0;--muted:#a39d96;--line:#4a4642;--font:"Rubik",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 32px 8px;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:400;margin:0}
.pages{display:flex;gap:6px;flex-wrap:wrap;padding:8px 32px 16px}
.pages a{color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:7px 12px;font-size:13px}
.pages a:hover{border-color:var(--ink)}
.pages span{font-size:12px;color:var(--muted);align-self:center;margin-right:6px;letter-spacing:.08em;text-transform:uppercase}
.phones{display:flex;gap:40px;justify-content:center;padding:8px 32px 48px;overflow-x:auto}
.ph{flex:none;display:flex;flex-direction:column;gap:12px;align-items:center}
.ph select{font:400 14px var(--font);background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:8px 10px;width:260px}
.frame{width:406px;height:860px;border-radius:44px;background:#111;padding:8px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.frame iframe{width:390px;height:844px;border:0;border-radius:36px;background:#f5f3f0;display:block}
</style>
</head>
<body>
<div class="top"><h1>Di'vani · мобильная версия (390 px)</h1><span style="color:var(--muted);font-size:13px">В каждом телефоне можно выбрать страницу</span></div>
<div class="pages" id="pages"><span>Десктоп:</span></div>
<div class="phones" id="phones"></div>
<script>
const P=[["index.html","Главная"],["category.html","Листинг: раскладные"],["product.html","Товар: Allure 260"],["showroom.html","Шоурумы и запись"],["despre.html","О нас"],["livrare.html","Доставка, кредит, гарантия"],["cos.html","Корзина и оформление"],["lemn-masiv.html","Хаб: массив ясеня"],["blog.html","Блог"],["articol.html","Статья"],["designeri.html","Для дизайнеров"],["404.html","Поиск / 404"]];
document.getElementById('pages').insertAdjacentHTML('beforeend',P.map(([h,t])=>`<a href="${h}">${t}</a>`).join(''));
const start=["index.html","category.html","product.html"];
document.getElementById('phones').innerHTML=start.map((s,i)=>`<div class="ph"><select aria-label="Страница в телефоне ${i+1}" data-i="${i}">${P.map(([h,t])=>`<option value="${h}"${h===s?' selected':''}>${t}</option>`).join('')}</select><div class="frame"><iframe id="fr${i}" src="${s}" title="Мобильный вид ${i+1}"></iframe></div></div>`).join('');
document.querySelectorAll('select').forEach(sel=>sel.onchange=()=>document.getElementById('fr'+sel.dataset.i).src=sel.value);
</script>
</body>
</html>
